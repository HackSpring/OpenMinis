name: Build Two-Pane APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - name: Add manual two-pane setting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('src/android/app/src/main/java/com/openminis/app/ui/settings/AppearanceScreen.kt')
          s=a.read_text()
          s=s.replace('import androidx.compose.material.icons.outlined.Visibility','import androidx.compose.material.icons.outlined.Visibility\nimport androidx.compose.material.icons.outlined.TableView')
          s=s.replace('const val KEY_LANGUAGE = "app_language"','const val KEY_LANGUAGE = "app_language"\nconst val KEY_FORCE_TWO_PANE = "appearance.force_two_pane"\nfun forceTwoPaneEnabled(context: Context) = getAppearancePrefs(context).getBoolean(KEY_FORCE_TWO_PANE, false)')
          s=s.replace('var autoGrouping by remember { mutableStateOf(prefs.getBoolean(KEY_AUTO_GROUPING, true)) }','var autoGrouping by remember { mutableStateOf(prefs.getBoolean(KEY_AUTO_GROUPING, true)) }\n    var forceTwoPane by remember { mutableStateOf(prefs.getBoolean(KEY_FORCE_TWO_PANE, false)) }')
          block='''SettingsSection(header = stringResource(R.string.appearance_section_two_pane), footer = stringResource(R.string.appearance_force_two_pane_footer)) {
            SettingsSwitchRow(icon = Icons.Outlined.TableView, iconColor = tilePurple, title = stringResource(R.string.appearance_force_two_pane_title), checked = forceTwoPane, onCheckedChange = { forceTwoPane = it; prefs.edit().putBoolean(KEY_FORCE_TWO_PANE, it).apply() }, showDivider = false)
        }

        '''
          s=s.replace('        // -- Font Size --', '        '+block+'// -- Font Size --')
          a.write_text(s)
          n=Path('src/android/app/src/main/java/com/openminis/app/ui/navigation/ChatSplitScaffold.kt')
          s=n.read_text().replace('import com.openminis.app.R','import com.openminis.app.R\nimport com.openminis.app.ui.settings.forceTwoPaneEnabled')
          old='''    return expandedWidth && nonCompactHeight'''
          new='''    val mediumWidth = windowSizeClass.isWidthAtLeastBreakpoint(WindowSizeClass.WIDTH_DP_MEDIUM_LOWER_BOUND)
    return (expandedWidth || (forceTwoPaneEnabled(LocalContext.current) && mediumWidth)) && nonCompactHeight'''
          n.write_text(s.replace(old,new))
          for f,needle,text in [('values/strings.xml','    <string name="appearance_section_font_size">','    <string name="appearance_section_two_pane">Two-Pane Layout</string>\n    <string name="appearance_force_two_pane_title">Enable on foldables</string>\n    <string name="appearance_force_two_pane_footer">Uses two panes in windows at least 600dp wide. Restart Minis after changing.</string>\n'),('values-zh/strings.xml','    <string name="appearance_section_font_size">','    <string name="appearance_section_two_pane">双栏布局</string>\n    <string name="appearance_force_two_pane_title">在折叠屏上启用</string>\n    <string name="appearance_force_two_pane_footer">窗口宽度至少为 600dp 时启用双栏。更改后请重启 Minis。</string>\n')]:
            p=Path('src/android/app/src/main/res')/f; q=p.read_text(); p.write_text(q.replace(needle,text+needle))
          b=Path('src/android/app/build.gradle.kts'); s=b.read_text().replace('applicationId = "com.openminis.app"','applicationId = "com.openminis.app.twopane"').replace('versionName = "1.13"','versionName = "1.13-twopane"'); b.write_text(s)
          PY
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
      - name: Build native sandbox
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
      - name: Build APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-1.13-FindN3-TwoPane
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
