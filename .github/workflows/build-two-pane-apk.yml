name: Build Two-Pane APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - name: Apply two-pane patch
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/twopane.patch
          git apply /tmp/twopane.patch
          sed -i 's/applicationId = "com.openminis.app"/applicationId = "com.openminis.app.twopane"/' src/android/app/build.gradle.kts
          sed -i 's/versionName = "1.13"/versionName = "1.13-twopane"/' src/android/app/build.gradle.kts
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
      - name: Build native sandbox
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
      - name: Build APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-1.13-FindN3-TwoPane
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
